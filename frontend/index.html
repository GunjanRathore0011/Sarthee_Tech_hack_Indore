<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="google" content="notranslate" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CyberSentinel</title>
  <link rel="stylesheet" href="/translate-fix.css" />
</head>

<body>
  <!-- React Root -->
  <div id="root"></div>

<!-- Navbar me jaha chahte ho waha ye div add karo -->
<div id="custom_translate" class="custom-translate">
  🌐 Select Language
  <select id="languageSwitcher" onchange="translateLanguage(this.value)">
    <option value="">Select</option>
    <option value="en">English</option>
    <option value="hi">हिंदी</option>
  </select>
</div>

<!-- Google Translate hidden container -->
<div id="google_translate_element" style="display:none;"></div>

<!-- Google Translate Script -->
<script type="text/javascript">
  function googleTranslateElementInit() {
    new google.translate.TranslateElement(
      {
        pageLanguage: 'en',
        includedLanguages: 'en,hi',
        autoDisplay: false
      },
      'google_translate_element'
    );
  }

  // Custom dropdown se Google ke original select box ko trigger karna
  function translateLanguage(lang) {
    if (lang === '') return;

    var selectField = document.querySelector("select.goog-te-combo");
    if (selectField) {
      selectField.value = lang;
      selectField.dispatchEvent(new Event("change"));
    }
    // dropdown reset (taaki close ho jaye)
    document.getElementById("languageSwitcher").value = "";
  }
</script>

<script type="text/javascript"
  src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<!-- Styling -->
<style>
  .custom-translate {
    position: absolute; /* ya navbar ke hisaab se flex */
    right: 20px;
    top: 0px;
    color: white;
  }
  .custom-translate select {
    margin-left: 5px;
    background: white;
    color: black;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
</style>

  <!-- React Entry -->
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
