<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="google" content="notranslate" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CyberSentinel</title>
  <link rel="stylesheet" href="/translate-fix.css" />
</head>

<body>
  <!-- React Root -->
  <div id="root"></div>

  <!-- 🔹 Google Translate Dropdown (appears on top of page) -->
  <div id="google_translate_element" style="position: fixed; top: 10px; right: 20px; z-index: 9999;"></div>

  <!-- 🔹 Google Translate Script -->
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement(
        {
          pageLanguage: 'en',              // Default site language
          includedLanguages: 'en,hi',      // Allowed languages
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE
        },
        'google_translate_element'
      );
    }
  </script>
  <script type="text/javascript"
    src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <!-- React Entry -->
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
